<nav class="navbar">
  <div class="container">
    <a routerLink="/" class="logo">ShopEase</a>

    <!-- 🍔 Hamburger Button — sirf mobile pe -->
    <button class="hamburger" (click)="toggleMenu(); $event.stopPropagation()">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <!-- Nav Links -->
    <div class="nav-links" [class.open]="isMenuOpen">
      <a routerLink="/products" (click)="closeMenu()">Products</a>

      @if (authService.isLoggedIn()) {
        <a routerLink="/cart" class="cart-link" (click)="closeMenu()">
          Cart
          @if (cartService.getCartItemCount() > 0) {
            <span class="badge">{{ cartService.getCartItemCount() }}</span>
          }
        </a>
        <a routerLink="/orders" (click)="closeMenu()">My Orders</a>
        @if (authService.isAdmin()) {
          <a routerLink="/admin" (click)="closeMenu()">Admin</a>
        }
        <span class="user-name">{{ (authService.currentUser$ | async)?.fullName }}</span>
        <button (click)="logout()" class="btn-logout">Logout</button>
      } @else {
        <a routerLink="/login" (click)="closeMenu()">Login</a>
        <a routerLink="/register" class="btn-register" (click)="closeMenu()">Register</a>
      }
    </div>
  </div>
</nav>
